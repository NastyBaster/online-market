name: Agent issue contract

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const required = [
              'Goal', 'Context', 'In scope', 'Out of scope',
              'Acceptance criteria', 'Allowed paths', 'Required checks',
              'Security and data constraints', 'Dependencies',
              'Human decision required'
            ];
            const missing = required.filter((heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`));
              if (!match) return true;
              const value = match[1]
                .replace(/<!--[^]*?-->/g, '')
                .replace(/_No response_/gi, '')
                .trim();
              return value.length === 0;
            });

            if (missing.length === 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '✅ Agent contract is complete. The issue is ready to be claimed.'
              });
              return;
            }

            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: context.issue.number,
              name: 'agent:ready'
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `❌ Removed \`agent:ready\`. Complete these sections: ${missing.map(x => `**${x}**`).join(', ')}.`
            });
            core.setFailed(`Incomplete agent contract: ${missing.join(', ')}`);
