name: Agent issue contract

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections and publish readiness
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const labelsResponse = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number,
              per_page: 100
            });
            const labels = labelsResponse.data.map((label) => label.name);
            const action = context.payload.action;
            const changedLabel = context.payload.label?.name;
            const workflowActor = context.payload.sender?.login === 'github-actions[bot]';

            let mode;
            if (action === 'labeled' && changedLabel === 'agent:validate') {
              mode = 'validate';
            } else if (action === 'labeled' && changedLabel === 'agent:ready' && !workflowActor) {
              mode = 'reject-manual-ready';
            } else if (action === 'edited' && labels.includes('agent:validate')) {
              mode = 'validate';
            } else if (action === 'edited' && labels.includes('agent:ready')) {
              mode = 'revalidate-ready';
            } else {
              return;
            }

            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };
            const upsertComment = async (marker, body) => {
              const comments = await github.rest.issues.listComments({
                ...context.repo,
                issue_number,
                per_page: 100
              });
              const existing = comments.data.find((comment) => comment.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              }
            };

            if (mode === 'reject-manual-ready') {
              await removeLabel('agent:ready');
              await upsertComment(
                '<!-- agent-contract:manual-ready -->',
                '<!-- agent-contract:manual-ready -->\n❌ Removed manual `agent:ready`. Add `agent:validate`; the workflow publishes `agent:ready` only after successful validation.'
              );
              core.setFailed('Manual agent:ready is not an allowed lifecycle transition. Use agent:validate.');
              return;
            }

            if (mode === 'revalidate-ready' || labels.includes('agent:ready')) {
              await removeLabel('agent:ready');
            }

            const body = issue.body || '';
            const required = [
              'Goal', 'Context', 'In scope', 'Out of scope',
              'Acceptance criteria', 'Allowed paths', 'Required checks',
              'Security and data constraints', 'Dependencies',
              'Human decision required'
            ];
            const missing = required.filter((heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`(?:^|\\r?\\n)### ${escaped}[ \\t]*\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)`));
              if (!match) return true;
              const value = match[1]
                .replace(/<!--[^]*?-->/g, '')
                .replace(/_No response_/gi, '')
                .trim();
              return value.length === 0;
            });

            await removeLabel('agent:validate');
            if (missing.length > 0) {
              await removeLabel('agent:ready');
              await upsertComment(
                '<!-- agent-contract:invalid -->',
                `<!-- agent-contract:invalid -->\n❌ Contract validation failed. Complete these sections: ${missing.map((heading) => `**${heading}**`).join(', ')}. Then add \`agent:validate\` again.`
              );
              core.setFailed(`Incomplete agent contract: ${missing.join(', ')}`);
              return;
            }

            await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['agent:ready'] });
            if (mode === 'validate') {
              await upsertComment(
                '<!-- agent-contract:ready -->',
                '<!-- agent-contract:ready -->\n✅ Agent contract is complete. The workflow added `agent:ready`; Codex CLI may now claim the issue.'
              );
            }
