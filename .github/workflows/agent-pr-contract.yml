name: Agent PR contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR report
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = [
              'Issue', 'Summary', 'Changes', 'Checks',
              'Migrations and configuration', 'Screenshots',
              'Risks and limitations', 'Rollback', 'Handoff'
            ];
            const missing = required.filter((heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`## ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n## |$)`));
              if (!match) return true;
              const value = match[1].replace(/<!--[^]*?-->/g, '').trim();
              return value.length === 0;
            });
            const closesIssue = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i.test(body);

            if (missing.length) {
              core.setFailed(`Incomplete PR report: ${missing.join(', ')}`);
            }
            if (!closesIssue) {
              core.setFailed('PR body must link its task with "Closes #<number>".');
            }
